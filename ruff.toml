exclude = [
    ".ebextensions",
    ".git",
    ".idea",
    ".platform",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    "__pycache__",
    "*-local.py",
    "dist",
    "fixtures",
    "node_modules",
    "public",
    "src",
    "venv"
]
extend-exclude = ["config/development-local.py"]
line-length = 150
indent-width = 4

# Python version
target-version = "py311"

[lint]
select = ['ALL']

# Rules to ignore
ignore = [
    "ANN", "ANN202", "ARG001", "ARG002", "B006", "B007", "B012", "B023", "B904", "B905", "BLE001", "C400", "C401",
    "C402", "C403", "C408", "C414", "C416", "C417", "D10", "D203", "D211", "D212", "D213", "DTZ", "E721", "E731",
    "EM101", "EM102", "FBT002", "FBT003", "FIX002", "FLY002", "FURB136", "G004", "ICN001", "INP001", "ISC002",
    "PERF102", "PERF401", "PERF402", "PIE804", "PLC0206", "PLC0415", "PLC1802", "PLR1714", "PLR1730", "PLR1736",
    "PLR2004", "PLR5501", "PLW0120", "PLW0603", "PLW2901", "PTH", "PYI024", "Q000", "RET503", "RET504", "RET505",
    "RET506", "RET506", "RET507", "RET508", "RUF005", "RUF010", "RUF012", "RUF015", "S101", "S104", "S105", "S108",
    "S311", "S603", "S607", "S608", "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM114", "SIM115", "SIM117",
    "SIM118", "SIM210", "SIM222", "SIM401", "SIM910", "SLF001", "TD002", "TD003", "TRY002", "TRY003", "TRY201",
    "TRY300", "TRY301", "TRY400", "TRY401", "UP012", "UP015", "UP017", "UP028", "W605"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pylint]
max-args = 21
max-branches = 15
max-statements = 60

[lint.mccabe]
max-complexity = 13

[lint.flake8-copyright]
notice-rgx = "(?i)Copyright\\s+(\\(C\\)|©)\\s*\\d{4}"

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
